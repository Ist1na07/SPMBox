name: Test and build Windows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:ui
      - run: npm run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged application
        run: npm run test:ui
        env:
          SPMBOX_UI_PACKAGED: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: SPM-Box-Windows-x64
          path: dist/*portable.exe
